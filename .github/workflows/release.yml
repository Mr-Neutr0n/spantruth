name: Release

# A release is a tag with notes. wiretruth runs from a clone (subjects live next to the source),
# so no wheel is published.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
